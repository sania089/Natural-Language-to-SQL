# One-command run: `docker compose up --build`  ->  http://localhost:8000
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env        # optional: provides GEMINI_API_KEY / GROQ_API_KEY / LLM_PROVIDER
        required: false
    environment:
      DATABASE_PATH: /app/data/ecommerce.db
    restart: unless-stopped
