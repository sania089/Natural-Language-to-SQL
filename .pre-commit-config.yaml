repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^backend/app/
        args: [--config-file=backend/pyproject.toml]
        additional_dependencies: [sqlglot>=30.0, fastapi>=0.115, pydantic>=2.8, pydantic-settings>=2.4, httpx>=0.27]
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --check
        language: system
        files: ^frontend/src/.*\.(ts|tsx|css)$
