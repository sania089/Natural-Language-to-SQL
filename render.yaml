# Render Blueprint: New + > Blueprint, point at this repo. Set the secret keys in the dashboard.
services:
  - type: web
    name: nl-to-sql
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false   # entered in the Render dashboard, never committed
      - key: GROQ_API_KEY
        sync: false
